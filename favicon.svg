<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Analog clock">
  <!-- Clock face: white with a black rim -->
  <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Tick marks at 12, 3, 6 and 9 o'clock -->
  <g stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="10" x2="50" y2="19"/>
    <line x1="50" y1="81" x2="50" y2="90"/>
    <line x1="10" y1="50" x2="19" y2="50"/>
    <line x1="81" y1="50" x2="90" y2="50"/>
  </g>
  <!-- Hour and minute hands (black), set to 10:10 -->
  <line x1="50" y1="50" x2="34" y2="37" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="76" y2="34" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Second hand (red) -->
  <line x1="50" y1="60" x2="50" y2="20" stroke="#d40000" stroke-width="2" stroke-linecap="round"/>
  <!-- Center pin -->
  <circle cx="50" cy="50" r="3.5" fill="#000000"/>
</svg>
